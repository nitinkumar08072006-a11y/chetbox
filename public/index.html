<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CipherRoom | Nitin Kumar (RGIPT CSD)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0b1329; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .reply-preview { border-left: 4px solid #06b6d4; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans">

  <!-- Authentication Panel -->
  <div id="auth-card" class="glass w-full max-w-md p-6 sm:p-8 rounded-2xl shadow-2xl space-y-5">
    <div class="text-center space-y-2">
      <div class="inline-block px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-[11px] font-semibold tracking-wide uppercase">
        A Product by Nitin Kumar
      </div>
      <p class="text-[10px] text-slate-400 font-medium">2nd Year CSD Student • RGIPT</p>
      <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-500 bg-clip-text text-transparent">CipherRoom</h1>
      <p class="text-slate-400 text-xs">End-to-End Encrypted Secure Portal (Up to 10 Users)</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="grid grid-cols-2 gap-2 bg-slate-900/80 p-1 rounded-xl border border-slate-700">
      <button id="tab-create" type="button" onclick="switchTab('create')" class="py-2 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition">Create Room</button>
      <button id="tab-join" type="button" onclick="switchTab('join')" class="py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">Join Room</button>
    </div>

    <!-- Form Container -->
    <div class="space-y-3.5">
      <div>
        <label class="text-xs font-semibold uppercase text-slate-400">Your Name</label>
        <input type="text" id="username" placeholder="e.g. Nitin Kumar" class="w-full mt-1 px-4 py-2.5 bg-slate-900/90 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-500 text-sm transition" />
      </div>

      <div>
        <label class="text-xs font-semibold uppercase text-slate-400">Room ID</label>
        <input type="text" id="room" placeholder="Enter Room ID" class="w-full mt-1 px-4 py-2.5 bg-slate-900/90 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-500 text-sm transition" />
      </div>

      <div>
        <label class="text-xs font-semibold uppercase text-slate-400">Passphrase</label>
        <input type="password" id="password" placeholder="Enter Secret Passphrase" class="w-full mt-1 px-4 py-2.5 bg-slate-900/90 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-500 text-sm transition" />
      </div>

      <button id="submit-btn" type="button" onclick="handleAuthSubmit()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-xl font-bold text-sm tracking-wide shadow-lg shadow-cyan-500/20 transition duration-200">
        Create & Launch Room
      </button>
    </div>
  </div>

  <!-- Main Chat Panel -->
  <div id="chat-card" class="glass w-full max-w-3xl h-[650px] rounded-2xl shadow-2xl flex-col hidden overflow-hidden">
    <!-- Header -->
    <div class="p-4 border-b border-slate-700/60 flex items-center justify-between bg-slate-900/40">
      <div>
        <div class="flex items-center gap-2">
          <h2 id="room-display" class="font-bold text-lg text-cyan-400"></h2>
          <button onclick="copyRoomDetails()" class="text-[10px] bg-cyan-950 hover:bg-cyan-900 text-cyan-300 px-2 py-0.5 rounded border border-cyan-800/50 transition">📋 Copy Room ID</button>
        </div>
        <span id="status-badge" class="text-xs px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-300 border border-yellow-500/30">Connecting...</span>
      </div>
      <button onclick="leaveRoom()" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg transition">Disconnect</button>
    </div>

    <!-- Messages Container -->
    <div id="messages" class="flex-1 p-4 overflow-y-auto space-y-3"></div>

    <!-- Reply Preview Box -->
    <div id="reply-box" class="hidden px-4 py-2 bg-slate-800/80 border-t border-slate-700/60 flex items-center justify-between">
      <div class="reply-preview pl-3 text-xs overflow-hidden pr-2">
        <span id="reply-sender" class="font-semibold text-cyan-400 block"></span>
        <span id="reply-text" class="text-slate-300 truncate block"></span>
      </div>
      <button onclick="cancelReply()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
    </div>

    <!-- Image Preview Box -->
    <div id="image-preview-box" class="hidden px-4 py-2 bg-slate-800/80 border-t border-slate-700/60 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="image-preview" class="h-10 w-10 object-cover rounded-md border border-slate-600" />
        <span class="text-xs text-slate-300">Photo attached ready to send</span>
      </div>
      <button onclick="clearImageAttachment()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
    </div>

    <!-- Input Bar -->
    <div class="p-3 border-t border-slate-700/60 flex gap-2 items-center bg-slate-900/30">
      <label for="img-input" class="cursor-pointer p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition">
        📷
        <input type="file" id="img-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)" />
      </label>
      <input type="text" id="msg-input" placeholder="Type an encrypted message..." onkeydown="if(event.key==='Enter') sendMessage()" class="flex-1 px-4 py-2.5 bg-slate-900/90 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-500 text-sm transition" />
      <button onclick="sendMessage()" class="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-sm transition shadow-md shadow-cyan-500/20">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let cryptoKey = null;
    let activeRoom = '';
    let myName = '';
    let currentMode = 'create';
    let selectedReply = null;
    let attachedImageBase64 = null;

    function switchTab(mode) {
      currentMode = mode;
      const createBtn = document.getElementById('tab-create');
      const joinBtn = document.getElementById('tab-join');
      const submitBtn = document.getElementById('submit-btn');

      if (mode === 'create') {
        createBtn.className = "py-2 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition";
        joinBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
        submitBtn.innerText = "Create & Launch Room";
      } else {
        joinBtn.className = "py-2 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition";
        createBtn.className = "py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
        submitBtn.innerText = "Join Private Room";
      }
    }

    async function hashPass(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function deriveKey(password, saltStr) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode(saltStr), iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function handleAuthSubmit() {
      try {
        const username = document.getElementById('username').value.trim();
        const room = document.getElementById('room').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !room || !password) {
          return alert("Please fill in your Name, Room ID, and Passphrase.");
        }

        myName = username;
        activeRoom = room;
        const passwordHash = await hashPass(password);
        cryptoKey = await deriveKey(password, room);

        if (currentMode === 'create') {
          socket.emit('create-room', { room, passwordHash, username });
        } else {
          socket.emit('join-room', { room, passwordHash, username });
        }
      } catch (err) {
        alert("An error occurred: " + err.message);
      }
    }

    socket.on('joined', ({ room, isHost }) => {
      document.getElementById('auth-card').classList.add('hidden');
      document.getElementById('chat-card').classList.remove('hidden');
      document.getElementById('chat-card').classList.add('flex');
      document.getElementById('room-display').innerText = `# ${room}`;

      if (isHost) {
        appendSystemMessage(`Room created successfully! Share Room ID "${room}" and your passphrase with your friends.`);
      } else {
        appendSystemMessage(`Joined room successfully! AES-256 encrypted session initialized.`);
      }
    });

    socket.on('error-msg', (msg) => alert(msg));

    socket.on('peer-status', ({ count, user, status }) => {
      const badge = document.getElementById('status-badge');
      badge.className = "text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      badge.innerText = `Active Members (${count}/10)`;

      if (status === 'connected' && user && user !== myName) {
        appendSystemMessage(`${user} joined the room.`);
      } else if (status === 'disconnected' && user) {
        appendSystemMessage(`${user} left the room.`);
      }
    });

    function copyRoomDetails() {
      navigator.clipboard.writeText(activeRoom);
      alert(`Room ID "${activeRoom}" copied to clipboard! Share it and your passphrase with your friends.`);
    }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        return alert('Image size should be under 3MB.');
      }
      const reader = new FileReader();
      reader.onload = function(evt) {
        attachedImageBase64 = evt.target.result;
        document.getElementById('image-preview').src = attachedImageBase64;
        document.getElementById('image-preview-box').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearImageAttachment() {
      attachedImageBase64 = null;
      document.getElementById('img-input').value = '';
      document.getElementById('image-preview-box').classList.add('hidden');
    }

    function setReply(sender, text) {
      selectedReply = { sender, text };
      document.getElementById('reply-sender').innerText = sender;
      document.getElementById('reply-text').innerText = text || '[Photo]';
      document.getElementById('reply-box').classList.remove('hidden');
    }

    function cancelReply() {
      selectedReply = null;
      document.getElementById('reply-box').classList.add('hidden');
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();

      if (!text && !attachedImageBase64) return;

      const payloadData = {
        sender: myName,
        text: text,
        image: attachedImageBase64,
        replyTo: selectedReply
      };

      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, enc.encode(JSON.stringify(payloadData)));

      appendMessage(myName, text, attachedImageBase64, selectedReply, true);

      socket.emit('send-message', {
        room: activeRoom,
        payload: {
          iv: Array.from(iv),
          data: Array.from(new Uint8Array(encrypted))
        }
      });

      input.value = '';
      cancelReply();
      clearImageAttachment();
    }

    socket.on('receive-message', async (payload) => {
      try {
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(payload.iv) },
          cryptoKey,
          new Uint8Array(payload.data)
        );
        const data = JSON.parse(new TextDecoder().decode(decrypted));
        appendMessage(data.sender, data.text, data.image, data.replyTo, false);
      } catch (e) {
        appendSystemMessage('Decryption error: Message couldn\'t be decrypted.');
      }
    });

    function appendMessage(sender, text, image, replyTo, isSelf) {
      const container = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'} my-1 group`;

      const alignClass = isSelf ? 'bg-cyan-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700';

      let replyHTML = '';
      if (replyTo) {
        replyHTML = `
          <div class="reply-preview bg-black/20 pl-2 pr-3 py-1 rounded mb-1 text-[11px]">
            <span class="font-bold text-cyan-300 block">${replyTo.sender}</span>
            <span class="opacity-80 truncate block">${replyTo.text || '[Photo]'}</span>
          </div>
        `;
      }

      let imageHTML = '';
      if (image) {
        imageHTML = `<img src="${image}" class="rounded-lg max-h-48 my-1 cursor-pointer border border-slate-700" onclick="window.open('${image}')" />`;
      }

      msgDiv.innerHTML = `
        <div class="max-w-[85%] px-3.5 py-2 rounded-2xl ${alignClass} text-sm shadow relative">
          <div class="flex items-center justify-between gap-3 mb-0.5">
            <span class="text-[11px] font-bold ${isSelf ? 'text-cyan-200' : 'text-cyan-400'}">${sender}</span>
            <button onclick="setReply('${sender}', '${(text || '').replace(/'/g, "\\'")}')" class="opacity-0 group-hover:opacity-100 text-[10px] bg-black/30 hover:bg-black/50 px-1.5 py-0.5 rounded transition">Reply</button>
          </div>
          ${replyHTML}
          ${imageHTML}
          ${text ? `<span>${text}</span>` : ''}
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function appendSystemMessage(text) {
      const container = document.getElementById('messages');
      container.innerHTML += `
        <div class="text-center my-2">
          <span class="text-[11px] bg-slate-800/80 text-slate-400 px-3 py-1 rounded-full border border-slate-700/50">${text}</span>
        </div>
      `;
      container.scrollTop = container.scrollHeight;
    }

    function leaveRoom() {
      window.location.reload();
    }
  </script>
</body>
</html>
